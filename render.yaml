services:
  - type: web
    name: campusfix-frontend
    runtime: static
    rootDir: campusfix
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://campusfix-production-203f8f19.up.railway.app
      - key: REACT_APP_API_URL
        value: https://campusfix-production-203f8f19.up.railway.app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html