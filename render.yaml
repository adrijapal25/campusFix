services:
  - type: web
    name: campusfix-frontend
    runtime: static
    rootDir: campusfix
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://campusfix-backend.onrender.com
      - key: REACT_APP_API_URL
        value: https://campusfix-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: campusfix-backend
    runtime: docker
    rootDir: backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://ep-calm-thunder-bdpowqif-pooler.c-8.us-east-2.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require
      - key: SPRING_DATASOURCE_USERNAME
        value: neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        value: npg_dpBjUGN7DkH9